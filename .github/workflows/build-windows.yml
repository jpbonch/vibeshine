---
name: Build Windows
permissions:
  contents: read

on:
  push:
    branches:
      - vibe
  workflow_dispatch:

jobs:
  build_windows:
    name: Windows Build
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download SudoVDA drivers from official Vibeshine release
        shell: pwsh
        run: |
          # Download the official Vibeshine MSI which contains signed SudoVDA drivers
          $vibeshine_version = "1.14.4"
          $msi_url = "https://github.com/Nonary/vibeshine/releases/download/${vibeshine_version}/Vibeshine.msi"
          $msi_path = "Vibeshine.msi"

          Write-Host "Downloading Vibeshine MSI from $msi_url"
          Invoke-WebRequest -Uri $msi_url -OutFile $msi_path

          # Extract MSI contents
          $extract_dir = "msi_extracted"
          Write-Host "Extracting MSI contents..."
          msiexec /a $msi_path /qn TARGETDIR="$PWD\$extract_dir"

          # Wait for extraction to complete
          Start-Sleep -Seconds 5

          # Find and copy SudoVDA driver files
          $sudovda_dest = "src_assets/windows/drivers/sudovda"
          $sudovda_src = Get-ChildItem -Path $extract_dir -Recurse -Directory | Where-Object { $_.Name -eq "sudovda" } | Select-Object -First 1

          if ($sudovda_src) {
            Write-Host "Found SudoVDA drivers at: $($sudovda_src.FullName)"
            Get-ChildItem -Path $sudovda_src.FullName | ForEach-Object {
              Write-Host "Copying: $($_.Name)"
              Copy-Item -Path $_.FullName -Destination $sudovda_dest -Force
            }
          } else {
            # Try alternate extraction with lessmsi or direct file search
            Write-Host "SudoVDA directory not found, searching for individual files..."
            $driver_files = @("SudoVDA.dll", "SudoVDA.inf", "sudovda.cat", "sudovda.cer", "nefconc.exe", "uninstall.bat")
            foreach ($file in $driver_files) {
              $found = Get-ChildItem -Path $extract_dir -Recurse -Filter $file -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                Write-Host "Found and copying: $file"
                Copy-Item -Path $found.FullName -Destination $sudovda_dest -Force
              } else {
                Write-Host "WARNING: Could not find $file"
              }
            }
          }

          # List what we have
          Write-Host "SudoVDA driver files:"
          Get-ChildItem -Path $sudovda_dest

          # Cleanup
          Remove-Item -Path $msi_path -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $extract_dir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ninja

      - name: Build
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DSUNSHINE_ENABLE_WEBRTC=OFF
          ninja -C build

      - name: Package
        run: |
          mkdir -p artifacts
          cd build
          cpack -G ZIP
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/Vibeshine-Windows-portable.zip || mv ./*.zip ../artifacts/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vibeshine-Windows
          path: artifacts/
          if-no-files-found: warn
